[project]
name = "bookkeeper"
version = "0.1.0"
description = "AI Bookkeeper API: Telegram bot, ledger, reports and web JSON API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi~=0.163.1",
    "uvicorn[standard]~=0.54.0",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.3",
    "authlib~=1.9.8",
    "itsdangerous~=2.2.0",
    "python-telegram-bot~=22.8",
    "langgraph~=1.2.22",
    "langgraph-checkpoint-postgres~=3.2.1",
    "google-genai~=3.4.0",
    "sqlalchemy[asyncio]~=2.1.9",
    "alembic~=1.20.1",
    "psycopg[binary,pool]~=3.3.9",
    "psycopg-pool~=3.3.3",
    "pgvector~=0.5.1",
    "apscheduler~=3.11.3",
    "weasyprint~=70.0",
    "jinja2~=3.1.6",
    "openpyxl~=3.1.5",
    "pillow~=13.0.0",
    "pillow-heif~=1.8.1",
    "rapidfuzz~=3.14.6",
    "tenacity~=9.1.4",
    "structlog~=26.1.0",
    "httpx~=0.28.1",
]

[project.scripts]
bk = "bookkeeper.cli:main"

[dependency-groups]
dev = [
    "ruff~=0.17.5",
    "mypy~=2.4.1",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "hypothesis~=6.170.15",
    "testcontainers[postgres]~=4.15.0",
    "time-machine~=3.6.0",
    "pytest-cov~=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeper"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["bookkeeper"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["bookkeeper"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
markers = [
    "integration: needs Postgres (testcontainers or TEST_DATABASE_URL) or starts the app as a process",
]

[tool.coverage.run]
source = ["bookkeeper"]
